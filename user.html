<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Panel - User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00ffff;
      --neon-pink: #ff00ff;
      --neon-green: #39ff14;
      --dark-bg: #0d0221;
      --light-bg: #261447;
      --text-color: #f0f0f0;
      --gold: #FFD700;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Russo One', sans-serif;
      background: radial-gradient(1000px 500px at 10% -20%, rgba(57,255,20,0.08), transparent),
                  radial-gradient(800px 400px at 110% 10%, rgba(0,255,255,0.08), transparent),
                  linear-gradient(180deg, #0d0221 0%, #120631 100%);
      color: var(--text-color);
    }

    /* Headings: solid neon color, NO text-shadow */
    h1, h2 { color: var(--neon-blue); margin: 0 0 12px 0; letter-spacing: 0.5px; }

    /* Sticky header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 2, 33, 0.85);
      backdrop-filter: blur(6px);
      border-bottom: 2px solid var(--neon-pink);
      box-shadow: 0 0 12px rgba(255, 0, 255, 0.35);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      flex-wrap: wrap;
    }

    .brand { color: var(--neon-green); font-size: 20px; margin-right: auto; }

    /* Buttons - neon theme */
    .btn {
      appearance: none;
      border: 2px solid var(--neon-blue);
      color: var(--text-color);
      background: transparent;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.35), inset 0 0 8px rgba(0, 255, 255, 0.2);
    }
    .btn:hover { box-shadow: 0 0 12px rgba(0,255,255,0.6), inset 0 0 12px rgba(0,255,255,0.35); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.active { border-color: var(--neon-pink); box-shadow: 0 0 12px rgba(255,0,255,0.6), inset 0 0 12px rgba(255,0,255,0.35); }

    .btn-pink { border-color: var(--neon-pink); box-shadow: 0 0 8px rgba(255, 0, 255, 0.35), inset 0 0 8px rgba(255,0,255,0.2); }
    .btn-green { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(57,255,20,0.35), inset 0 0 8px rgba(57,255,20,0.2); }

    /* Inputs - neon theme */
    .input, .textarea, .select {
      width: 100%;
      border: 2px solid var(--neon-green);
      background: rgba(38, 20, 71, 0.5);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 10px;
      outline: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.35), inset 0 0 8px rgba(57, 255, 20, 0.2);
    }
    .input::placeholder, .textarea::placeholder { color: #bfbfbf; }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--neon-blue); box-shadow: 0 0 12px rgba(0,255,255,0.6), inset 0 0 12px rgba(0,255,255,0.35); }

    /* Layout helpers used across pages */
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px 40px; }

    /* Main grid for user content */
    main#content-grid {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* Cards */
    .card {
      background: rgba(38, 20, 71, 0.7);
      border: 2px solid var(--neon-blue);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 14px rgba(0,255,255,0.2);
      padding: 0;
    }
    .card-header { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 2px solid rgba(0,255,255,0.25); }
    .card-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; border: 2px solid var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,255,0.35); background: #000; }
    .card-title { margin: 0; font-size: 18px; color: var(--neon-blue); }
    .badge { margin-left: auto; font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 2px solid var(--neon-green); color: var(--neon-green); }

    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* Stars */
    .stars { display: inline-flex; gap: 6px; align-items: center; }
    .star { cursor: pointer; font-size: 20px; color: #777; transition: transform 0.05s ease, text-shadow 0.2s ease, color 0.2s ease; }
    .star:hover { transform: scale(1.08); }
    .star.active { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.45); }

    .card-actions { display: flex; gap: 10px; }
    .btn-play { border-color: var(--neon-green); }
    .btn-open { border-color: var(--neon-pink); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(1000px, 92vw);
      height: min(700px, 80vh);
      background: var(--light-bg);
      border: 2px solid var(--neon-pink);
      border-radius: 14px;
      box-shadow: 0 0 18px rgba(255,0,255,0.4);
      display: flex; flex-direction: column;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 2px solid rgba(255,0,255,0.25); }
    .modal-title { color: var(--neon-blue); font-size: 18px; margin: 0; }
    .modal-close { border-color: var(--neon-pink); }
    .modal-body { flex: 1; }
    .modal-iframe { width: 100%; height: 100%; border: 0; background: #000; }

    /* Admin layout helpers also available here for consistency */
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 2fr 1fr 1fr; } }
    .row { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 700px) { .row-2 { grid-template-columns: 1fr 1fr; } }

    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .list-item { padding: 12px; border: 2px solid var(--neon-pink); border-radius: 12px; background: rgba(38,20,71,0.55); display: flex; flex-direction: column; gap: 8px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }

    label { font-size: 12px; color: var(--neon-blue); }

    /* Utility */
    .hidden { display: none !important; }
    .controls { display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">NEON HUB</div>
      <div class="controls">
        <button class="btn active" data-filter="all">All</button>
        <button class="btn" data-filter="games">Games</button>
        <button class="btn" data-filter="apps">Apps</button>
      </div>
      <input id="search-input" class="input" type="search" placeholder="Search..." />
    </div>
  </header>

  <main id="content-grid" aria-live="polite"></main>

  <div id="play-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="play-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="play-title" class="modal-title">Play</h2>
        <button id="close-modal" class="btn modal-close">Close</button>
      </div>
      <div class="modal-body">
        <iframe id="play-iframe" class="modal-iframe" title="Play"></iframe>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      /* ======================================================================
         ======================================================================
         🔥🔥 PASTE YOUR FIREBASE WEB SDK CONFIG SNIPPET HERE 🔥🔥

         Optionally include Firebase SDK script tags (commented) before using:
         <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"><\/script>
         <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"><\/script>

         Then define your config object:
      */
      // const firebaseConfig = {
      //   apiKey: "AIza...",
      //   authDomain: "...",
      //   databaseURL: "...",
      //   projectId: "...",
      //   storageBucket: "...",
      //   messagingSenderId: "...",
      //   appId: "..."
      // };
      /* ======================================================================
         ====================================================================== */

      // --- STEP 1: Initialize Firebase ---
      // TODO: Uncomment the lines below after pasting your config.
      // firebase.initializeApp(firebaseConfig);
      // const db = firebase.database();

      // DOM Element variables (these are complete)
      const contentGrid = document.getElementById('content-grid');
      const filterButtons = document.querySelectorAll('[data-filter]');
      const searchInput = document.getElementById('search-input');
      const playModal = document.getElementById('play-modal');
      const playIframe = document.getElementById('play-iframe');
      const closeModalBtn = document.getElementById('close-modal');

      let allItems = []; // To hold data from Firebase
      let activeFilter = 'all';
      let searchQuery = '';

      // --- STEP 2: Fetch Data from Firebase ---
      // TODO: Implement the Firebase listener to fetch all items from the 'items' node.
      // db.ref('items').on('value', (snapshot) => {
      //   const data = snapshot.val();
      //   if (!data) {
      //     allItems = [];
      //     renderContent();
      //     return;
      //   }
      //   allItems = Object.entries(data).map(([id, item]) => ({ id, ...item }));
      //   renderContent();
      // });

      function renderContent() {
        // This function filters and renders cards from the 'allItems' array.
        const q = searchQuery.trim().toLowerCase();
        const filtered = allItems.filter((item) => {
          const matchesType = activeFilter === 'all' || (item.type || '').toLowerCase() === activeFilter;
          const matchesSearch = !q || (item.title || '').toLowerCase().includes(q);
          return matchesType && matchesSearch;
        });

        contentGrid.innerHTML = '';
        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'card';
          empty.innerHTML = `
            <div class="card-body">
              <h2 style="margin:0;">No items</h2>
              <p style="opacity:0.8;margin:0;">Once you connect Firebase and add items, they will appear here.</p>
            </div>
          `;
          contentGrid.appendChild(empty);
          return;
        }

        for (const item of filtered) {
          const card = document.createElement('article');
          card.className = 'card';

          const avg = Number(item.avgRating || 0);
          const rounded = Math.round(avg);

          card.innerHTML = `
            <div class="card-header">
              <img class="card-logo" src="${item.logoUrl || ''}" alt="${item.title || 'Logo'}" />
              <h3 class="card-title">${item.title || ''}</h3>
              <span class="badge">${(item.type || '').toUpperCase()}</span>
            </div>
            <div class="card-body">
              <div class="stars" data-id="${item.id}">
                ${[1,2,3,4,5].map(n => `<span class=\"star ${n <= rounded ? 'active' : ''}\" data-value=\"${n}\">★</span>`).join('')}
                <span style="margin-left:8px;opacity:0.85;">${avg.toFixed(1)} (${item.totalRatings || 0})</span>
              </div>
              <div class="card-actions">
                <button class="btn btn-play" data-action="play" data-id="${item.id}">Play</button>
                <button class="btn btn-open" data-action="open" data-id="${item.id}">Open in New Tab</button>
              </div>
            </div>
          `;

          contentGrid.appendChild(card);
        }
      }

      function handleRatingClick(e) {
        const star = e.target.closest('.star');
        if (!star) return;
        const starsEl = star.closest('.stars');
        if (!starsEl) return;

        const itemId = starsEl.dataset.id;
        const rating = Number(star.dataset.value);

        if (localStorage.getItem(`rated_${itemId}`)) {
          alert("You've already rated this!");
          return;
        }

        // --- STEP 3: Update Rating in Firebase ---
        // TODO: Implement the Firebase transaction to atomically update the item's rating.
        // const itemRef = db.ref('items/' + itemId);
        // itemRef.transaction((currentItemData) => {
        //   if (currentItemData) {
        //     const total = Number(currentItemData.totalRatings || 0) + 1;
        //     const sum = Number(currentItemData.sumOfRatings || 0) + rating;
        //     const avg = sum / total;
        //     currentItemData.totalRatings = total;
        //     currentItemData.sumOfRatings = sum;
        //     currentItemData.avgRating = avg;
        //   }
        //   return currentItemData;
        // });

        localStorage.setItem(`rated_${itemId}`, String(rating));

        // UI update for stars
        const stars = Array.from(starsEl.querySelectorAll('.star'));
        stars.forEach((s, idx) => {
          if (idx < rating) s.classList.add('active');
          else s.classList.remove('active');
        });
      }

      // Event listeners for filters, search, modal, and rating
      document.addEventListener('click', (e) => {
        // Filter buttons
        const filterBtn = e.target.closest('[data-filter]');
        if (filterBtn) {
          filterButtons.forEach(b => b.classList.remove('active'));
          filterBtn.classList.add('active');
          activeFilter = filterBtn.dataset.filter;
          renderContent();
          return;
        }

        // Card actions
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          const id = actionBtn.dataset.id;
          const item = allItems.find(i => i.id === id);
          if (!item) return;

          if (action === 'play') {
            document.getElementById('play-title').textContent = item.title || 'Play';
            // Prefer srcdoc for inline HTML code
            playIframe.removeAttribute('src');
            playIframe.setAttribute('srcdoc', item.htmlCode || '<h1 style="color:white">No HTML</h1>');
            playModal.classList.add('open');
          } else if (action === 'open') {
            // Open HTML in a new tab via data URL
            const blob = new Blob([item.htmlCode || '<h1>No HTML</h1>'], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          }
          return;
        }

        // Rating stars
        if (e.target.closest('.star')) {
          handleRatingClick(e);
          return;
        }

        // Close modal when clicking backdrop
        if (e.target === playModal) {
          playModal.classList.remove('open');
          playIframe.removeAttribute('srcdoc');
          playIframe.removeAttribute('src');
          return;
        }
      });

      closeModalBtn.addEventListener('click', () => {
        playModal.classList.remove('open');
        playIframe.removeAttribute('srcdoc');
        playIframe.removeAttribute('src');
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value || '';
        renderContent();
      });

      // Initial empty render
      renderContent();
    });
  </script>
</body>
</html>
